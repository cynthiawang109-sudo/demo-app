services:
  - type: web
    name: taskflow-demo-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TASKFLOW_DB_PATH
        value: /tmp/tasks.db
