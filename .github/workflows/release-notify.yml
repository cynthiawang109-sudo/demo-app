name: Release notification

on:
  release:
    types: [published]

jobs:
  notify-success:
    uses: cynthiawang109-sudo/ai-workspace-kit/.github/workflows/slack-notify.yml@e3a66ed021ebb250b04702f5c2fc1382f381dc33
    with:
      text: >-
        demo-app release ${{ github.event.release.tag_name }} published successfully:
        ${{ github.event.release.html_url }}
    secrets: inherit
