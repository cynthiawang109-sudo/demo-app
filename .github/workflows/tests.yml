name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Download published spec
        run: curl --fail --show-error --location https://raw.githubusercontent.com/cynthiawang109-sudo/taskflow-api-docs/main/openapi.yaml --output "$GITHUB_WORKSPACE/openapi.yaml"
      - name: Check spec conformance
        env:
          TASKFLOW_SPEC_PATH: ${{ github.workspace }}/openapi.yaml
        run: pytest tests/test_spec_conformance.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint (rule set pinned in ruff.toml)
        run: ruff check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Byte-compile all sources
        run: python -m compileall -q main.py digest.py scripts tests
      - name: Import smoke test
        run: python -c "import main; import digest"
      - name: Build the container image
        run: docker build -t taskflow-demo-app .
      - name: Smoke-test the container
        run: |
          docker run -d --name demo -p 8000:8000 taskflow-demo-app
          for i in $(seq 1 15); do
            if curl -fs http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs demo
          exit 1
